<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoilSense - E-Store</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="estore.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        earth: {
                            800: '#1a2e22',
                            900: '#0f1c14',
                            950: '#08100b',
                        },
                        leaf: {
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                        },
                        soil: {
                            300: '#d97706',
                            400: '#b45309',
                            800: '#2d1f18',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-earth-950 text-slate-200 font-sans antialiased selection:bg-leaf-500 selection:text-earth-950">

    <div class="main min-h-screen flex flex-col justify-between">
        
        <!-- HEADER NAVBAR -->
        <header class="navbar sticky top-0 z-50 backdrop-blur-md bg-earth-950/80 border-b border-earth-800/60 transition-all duration-300">
            <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                
                <!-- BRAND LOGO -->
                <div class="logo flex items-center gap-3">
                    <div class="icon w-10 h-10 rounded-xl bg-gradient-to-br from-leaf-400 to-leaf-600 flex items-center justify-center text-earth-950 font-black text-xl shadow-lg shadow-leaf-500/20">
                        <i class="fa-solid fa-leaf"></i>
                    </div>
                    <span class="brand text-2xl font-bold tracking-tight text-white">Soil<span class="text-leaf-400">Sense</span></span>
                </div>

                <!-- NAVIGATION LINKS -->
                <ul class="menu flex items-center gap-8 text-sm font-medium text-slate-300">
                    <li><a href="index.html" class="hover:text-leaf-400 transition-colors py-2">Home</a></li>
                    <li><a href="estore.html" class="hover:text-leaf-400 transition-colors py-2 border-b-2 border-leaf-400 text-white font-semibold">E-Store</a></li>
                </ul>

                <!-- START ANALYSIS BUTTON -->
                <div class="actions flex items-center gap-4">
                    <a href="camera.html" class="button px-5 py-2.5 rounded-full bg-leaf-500 hover:bg-leaf-400 text-earth-950 font-bold text-sm transition-all duration-200 shadow-lg shadow-leaf-500/25 flex items-center gap-2">
                        <i class="fa-solid fa-camera"></i> Start Analysis
                    </a>
                </div>
            </nav>
        </header>

        <!-- MAIN E-STORE CONTENT AREA -->
        <main class="content max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow">
            <div class="text-center space-y-4 my-8">
                <div class="badge inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-earth-800/80 border border-leaf-500/30 text-leaf-400 text-xs font-semibold uppercase tracking-wider">
                    <i class="fa-solid fa-store text-xs"></i> Official SoilSense Store
                </div>
                <h1 class="text-4xl sm:text-5xl font-extrabold text-white">
                    SoilSense <span class="text-transparent bg-clip-text bg-gradient-to-r from-leaf-400 to-emerald-200">E-Store</span>
                </h1>
                <p class="text-slate-300 max-w-xl mx-auto text-base sm:text-lg">
                    Browse our products, soil-testing kits, and agricultural tools.
                </p>
            </div>

            <div class="items">
                
                <div class="section-items">
                    <img src="person.png" alt="">
                </div>

            </div>


        </main>

        <!-- FOOTER -->
        <footer class="footer border-t border-earth-800 bg-earth-950 py-8 mt-12">
            <div class="content max-w-7xl mx-auto px-4 text-center text-slate-400 text-sm">
                <p>&copy; 2026 <strong>SoilSense</strong> AI Advisory. All rights reserved.</p>
            </div>
        </footer>
    </div>

</body>
</html>
